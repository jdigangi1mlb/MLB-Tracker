name: Update MLB Trade Tracker

on:
  schedule:
    # Runs at minutes 2, 7, 12, 17, and so on.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: mlb-trade-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      deploy: ${{ steps.diff.outputs.deploy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, verify, and build tracker
        run: python scripts/build_tracker.py

      - name: Detect tracker changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/snapshot.json site/index.html assets/team-logos; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || ! git diff --quiet -- site/index.html; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed ledger
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "mlb-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site assets/team-logos
          git commit -m "Update MLB trade tracker"
          git push

      - name: Create change alert
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "MLB trade tracker changed — $(date -u '+%Y-%m-%d %H:%M UTC')"             --body-file data/change_summary.md

      - name: Configure GitHub Pages
        if: steps.diff.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.diff.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: needs.update.outputs.deploy == 'true'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
